<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow" cx="600" cy="230" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="600" cy="315" r="720" gradientUnits="userSpaceOnUse">
      <stop offset="0.35" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b1022" stop-opacity="0.95"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.3" fill="#818cf8" fill-opacity="0.22"/>
    </pattern>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="logoGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- Logo: 24x32 viewBox scaled 4x, centered on x=600 (visible top y=100) -->
  <g transform="translate(552 68) scale(4)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <g opacity="0.55" filter="url(#logoGlow)" stroke="#6366f1" stroke-width="2.5">
      <path d="M 4 8 L 0 16 L 4 24 M 20 8 L 24 16 L 20 24"/>
      <rect x="6" y="28" width="12" height="2" rx="1" fill="#6366f1" stroke="none"/>
    </g>
    <path d="M 4 8 L 0 16 L 4 24 M 20 8 L 24 16 L 20 24" stroke="#a5b4fc" stroke-width="2.5"/>
    <rect x="6" y="28" width="12" height="2" rx="1" fill="#818cf8"/>
  </g>

  <!-- Title -->
  <text x="600" y="298" text-anchor="middle"
        font-family="system-ui, Inter, Helvetica, Arial, sans-serif"
        font-size="96" font-weight="700" letter-spacing="-2"
        fill="#f8fafc">Indie<tspan fill="#818cf8">Desk</tspan></text>

  <!-- Subtitle -->
  <text x="600" y="370" text-anchor="middle"
        font-family="system-ui, Inter, Helvetica, Arial, sans-serif"
        font-size="36" font-weight="400" fill="#cbd5e1">A self-hosted workspace for indie developers</text>

  <!-- Pill badge (300px wide: fits the widest measured fallback, 234px, with padding) -->
  <rect x="450" y="404" width="300" height="44" rx="22"
        fill="#6366f1" fill-opacity="0.16" stroke="#818cf8" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="600" y="433" text-anchor="middle"
        font-family="system-ui, Inter, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="600" fill="#c7d2fe">Built with Laravel 12</text>

  <!-- Footer -->
  <text x="600" y="530" text-anchor="middle"
        font-family="system-ui, Inter, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="500" fill="#64748b" letter-spacing="0.5">docs.indiedesk.link</text>
</svg>
